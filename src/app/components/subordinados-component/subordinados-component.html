<h1>Subordinados</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Apellido</th>
            <th>Oficio</th>
            <th>Salario</th>
            <th>Director</th>
        </tr>
    </thead>
    <tbody>
        @for(subordinado of listaSubordinados; track subordinado) {
            <tr>
                <td>{{subordinado.idEmpleado}}</td>
                <td>{{subordinado.apellido}}</td>
                <td>{{subordinado.oficio}}</td>
                <td>{{subordinado.salario}}</td>
                <td>{{subordinado.director}}</td>
            </tr>
        }
    </tbody>
</table>
